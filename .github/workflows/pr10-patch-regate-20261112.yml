name: "PR10 patched SHA regate (synthetic only)"

on:
  push:
    branches:
      - research/pr10-sha-7eff2a5-20261111
    paths:
      - ".github/workflows/pr10-patch-regate-20261112.yml"

permissions:
  contents: read

jobs:
  bounded-regate:
    if: github.repository == 'eltokhey1/hermes-agent'
    name: "PR10 32 original + 8 adversarial / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PATCH_SHA: "a06c67115ebfe86895d43038dc1fcdf4589fd0ff"
      AUDIT_SHA: "9d392045eec24ab67beba8e1088377bbbf65485e"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PR10_SOURCE_SCRIPT: "${{ github.workspace }}/src/optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py"
    steps:
      - name: Checkout patched original source and original tests at exact SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PATCH_SHA }}
          path: src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py
            tests/skills/test_shipment_intelligence_skill.py
          sparse-checkout-cone-mode: false
      - name: Checkout previous separate adversarial tests at exact SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.AUDIT_SHA }}
          path: audit
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            verification/test_pr10_independent_acceptance.py
          sparse-checkout-cone-mode: false
      - name: Verify two immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "$PATCH_SHA"
          test "$(git -C audit rev-parse HEAD)" = "$AUDIT_SHA"
          test "$(git -C src hash-object optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py)" = "e91321927da1d3ac8f5281a896f8cba7b310b1f7"
          test "$(git -C src hash-object tests/skills/test_shipment_intelligence_skill.py)" = "8866387ed61c9bb8105225a2187d97b149b50661"
          echo "VERIFIED_PATCH_SHA=$PATCH_SHA"
          echo "VERIFIED_AUDIT_SHA=$AUDIT_SHA"
          echo "ORIGINAL_PR_HEAD=7eff2a5723303f20aff3dbb91380fb5a09328368"
      - name: Install Python 3.13 in ephemeral runner
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pytest 9.0.2 in ephemeral runner
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input --no-cache-dir "pytest==9.0.2"
      - name: Original author tests at PATCH_SHA
        shell: bash
        run: python -m pytest -q src/tests/skills/test_shipment_intelligence_skill.py
      - name: Previously written 8 independent negative tests at PATCH_SHA
        shell: bash
        run: python -m pytest -q -ra audit/verification/test_pr10_independent_acceptance.py
      - name: Explicit non-production boundary
        if: always()
        shell: bash
        run: |
          echo "PRODUCTION=HOLD"
          echo "HITL=REQUIRED"
          echo "G0_GCODE_G1=NO-GO"
          echo "REAL_CARRIER_EVENTS=NOT_TESTED"
          echo "WINDOWS_HOST_P0_P1=NOT_TESTED"
          echo "CRYPTOGRAPHIC_PROVIDER_AUTHENTICATION=NOT_TESTED"
