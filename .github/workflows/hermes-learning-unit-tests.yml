name: Hermes Learning Unit Offline Tests
on:
  push:
    paths:
      - 'ops/portfolio/learning_unit/**'
      - '.github/workflows/hermes-learning-unit-tests.yml'
  pull_request:
    paths:
      - 'ops/portfolio/learning_unit/**'
      - '.github/workflows/hermes-learning-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit:
    name: Python offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ops/portfolio/learning_unit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run standard-library regression tests
        run: python3 -m unittest discover -v
      - name: Evaluate synthetic registry (no external calls)
        run: python3 learning_unit.py registry.example.json
