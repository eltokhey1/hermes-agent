name: Hermes Owner Lab (isolated, non-acceptance)

on:
  pull_request:
    paths:
      - 'owner-lab/multiagent-safe-v3/**'
      - '.github/workflows/hermes-owner-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-lab-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-unit-tests:
    name: Python 3.13 / ${{ matrix.os }} (synthetic only)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    steps:
      - name: Check out without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            owner-lab/multiagent-safe-v3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Compile (stdlib only)
        working-directory: owner-lab/multiagent-safe-v3
        shell: bash
        run: python -m compileall -q approvals.py local_router.py orchestrator.py patterns.py physical_sim.py tests
      - name: Run fail-closed synthetic regression suite
        working-directory: owner-lab/multiagent-safe-v3
        shell: bash
        run: python -W error -m unittest discover -s tests -v
      - name: Validate Windows owner preflight output (hosted runner only)
        if: runner.os == 'Windows'
        working-directory: owner-lab/multiagent-safe-v3
        shell: pwsh
        run: |
          $json = & .\WINDOWS_READONLY_PREFLIGHT.ps1 | Out-String
          $receipt = $json | ConvertFrom-Json
          if ($receipt.schema_version -ne 2) { throw 'Invalid owner inventory schema' }
          if ($receipt.collection_mode -ne 'READ_ONLY_NO_INSTALL_NO_CREDENTIAL_ACCESS') { throw 'Unexpected collection mode' }
          if ($receipt.production_ready -ne $false) { throw 'A probe cannot declare production ready' }
          if ($receipt.acceptance.protected_backup_and_isolated_restore -ne 'NOT_TESTED') { throw 'Incorrect backup acceptance claim' }
          if ($receipt.acceptance.real_p1_crash_recovery -ne 'NOT_TESTED') { throw 'Incorrect P1 acceptance claim' }
          if ($receipt.local_loopback.process_identity_verified -ne $false) { throw 'Port probe cannot assert process identity' }
          Write-Output 'HOSTED_WINDOWS_INVENTORY_CONTRACT=PASS; OWNER_WINDOWS_P0=UNVERIFIED'
      - name: Explicit acceptance boundary
        shell: bash
        run: |
          echo 'OFFLINE_SYNTHETIC=PASS does not prove production, external approval identity or owner Windows P0/P1'
          echo 'PRODUCTION=HOLD'
