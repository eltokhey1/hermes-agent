name: Hermes HX P1 real fake-LLM conversation offline (NO-GO)

on:
  push:
    branches:
      - research/hx-p1-real-turn-fake-provider-20261124
    paths:
      - .github/workflows/hx-p1-real-turn-fake-provider.yml

permissions:
  contents: read

concurrency:
  group: hx-p1-fake-turn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-regressions:
    name: Real AIAgent fake HTTP conversation with denied file-write tool
    if: github.repository == 'eltokhey1/hermes-agent' && github.ref == 'refs/heads/research/hx-p1-real-turn-fake-provider-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRODUCTION: HOLD
      HITL: REQUIRED
      PAID_SPEND_USD: '0'
      HX_SOURCE_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout pinned research source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin source SHA and real fake-provider test
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'eltokhey1/hermes-agent'
          test "$GITHUB_REF" = 'refs/heads/research/hx-p1-real-turn-fake-provider-20261124'
          test "$(git rev-parse HEAD)" = "$HX_SOURCE_SHA"
          test -f tests/agent/test_hx_p1_fake_provider_write_denial.py
          printf 'SOURCE_SHA=%s\nTARGET_TEST_FILES=1\n' "$HX_SOURCE_SHA"
      - name: Prepare locked Python 3.14 dev and test environment with NO cache
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
      - name: Verify actual pytest environment and exact source version
        shell: bash
        run: |
          set -euo pipefail
          test -x "$HERMES_PYTHON"
          "$HERMES_PYTHON" -B -c 'import sys,pytest; assert sys.version_info[:2]==(3,14); print("TESTENV_PY314=VERIFIED",sys.version.split()[0],"PYTEST",pytest.__version__)'
          test "$(git rev-parse HEAD)" = "$HX_SOURCE_SHA"
      - name: Run real AIAgent turn test with source readonly and egress isolated
        shell: bash
        run: |
          set -euo pipefail
          export HX_RUNNER_UID="$(id -u)" HX_RUNNER_GID="$(id -g)"
          test "$HX_RUNNER_UID" -ne 0
          mkdir -p "$RUNNER_TEMP/hx-p1-tests-home" "$RUNNER_TEMP/hx-p1-test-runtime"
          export HX_RUNNER_HOME="$RUNNER_TEMP/hx-p1-tests-home"
          BEFORE="$(sha256sum AGENTS.md | cut -d ' ' -f 1)"
          # The existing test runner always writes test_durations.json. Bind ONLY
          # this synthetic metadata file to a writable runner-temp file.
          test ! -e test_durations.json
          : > test_durations.json
          printf '{}\n' > "$RUNNER_TEMP/hx-test-durations.json"
          # Script inside a separate namespace; it has no GITHUB_TOKEN, credentials, or outbound network.
          cat > "$RUNNER_TEMP/hx-fake-turn-tests.sh" <<'SH'
          set -euo pipefail
          "$HERMES_PYTHON" -B "$RUNNER_TEMP/hx-fake-turn-preflight.py"
          echo 'HX_REAL_FAKE_TURN_E2E=BEGIN'
          bash scripts/run_tests.sh -j 1 tests/agent/test_hx_p1_fake_provider_write_denial.py
          echo 'HX_REAL_FAKE_TURN_E2E=PASS'
          SH
          cat > "$RUNNER_TEMP/hx-fake-turn-preflight.py" <<'PY'
          import pathlib
          import socket
          import sys
          status = pathlib.Path("/proc/self/status").read_text()
          assert "NoNewPrivs:\t1" in status, "no_new_privs missing"
          assert "CapEff:\t0000000000000000" in status, "effective capabilities present"
          assert "CapBnd:\t0000000000000000" in status, "bounding capabilities present"
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=1)
          except OSError:
              pass
          else:
              raise AssertionError("external network unexpectedly reachable")
          protected = pathlib.Path("AGENTS.md")
          expected = protected.read_bytes()
          try:
              protected.write_bytes(b"DO_NOT_WRITE")
          except OSError:
              pass
          else:
              raise AssertionError("checkout writable")
          assert protected.read_bytes() == expected
          pathlib.Path("test_durations.json").write_text("{}\n")
          assert sys.version_info[:2] == (3, 14)
          print("HX_OS_BOUNDARY=VERIFIED_PARTIAL network_isolated+readonly_repo+zero_caps+no_new_privs")
          PY
          chmod 644 "$RUNNER_TEMP/hx-fake-turn-tests.sh" "$RUNNER_TEMP/hx-fake-turn-preflight.py"
          # Namespace must be built successfully BEFORE any real test imports execute.
          timeout 720 sudo -n /usr/bin/env \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            HX_SOURCE_SHA="$HX_SOURCE_SHA" HX_RUNNER_UID="$HX_RUNNER_UID" \
            HX_RUNNER_GID="$HX_RUNNER_GID" HX_RUNNER_HOME="$HX_RUNNER_HOME" \
            HERMES_PYTHON="$HERMES_PYTHON" \
            /usr/bin/unshare --mount --net --pid --fork /bin/bash -euo pipefail -c '
              mount --make-rprivate /
              mount --bind "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
              mount -o remount,bind,ro "$GITHUB_WORKSPACE"
              mount --bind "$RUNNER_TEMP/hx-test-durations.json" "$GITHUB_WORKSPACE/test_durations.json"
              /usr/sbin/ip link set lo up
              cd "$GITHUB_WORKSPACE"
              exec setpriv --reuid="$HX_RUNNER_UID" --regid="$HX_RUNNER_GID" \
                --clear-groups --no-new-privs --bounding-set=-all \
                --inh-caps=-all --ambient-caps=-all /usr/bin/env -i \
                PATH=/usr/local/bin:/usr/bin:/bin HOME="$HX_RUNNER_HOME" \
                HERMES_HOME="$HX_RUNNER_HOME" HERMES_RUNTIME_DIR="$RUNNER_TEMP/hx-p1-test-runtime" \
                HERMES_PYTHON="$HERMES_PYTHON" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
                HX_SOURCE_SHA="$HX_SOURCE_SHA" RUNNER_TEMP="$RUNNER_TEMP" \
                PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
                /bin/bash "$RUNNER_TEMP/hx-fake-turn-tests.sh"
            '
          AFTER="$(sha256sum AGENTS.md | cut -d ' ' -f 1)"
          test "$BEFORE" = "$AFTER"
          printf 'HX_SOURCE_SHA=%s\nSOURCE_UNCHANGED_SHA256=%s\n' "$HX_SOURCE_SHA" "$AFTER"
      - name: Record conservative authorization outcome for every exit
        if: always()
        shell: bash
        run: |
          echo "PRODUCTION=HOLD"
          echo "HITL=REQUIRED"
          echo "G0/G-CODE/G1=NO-GO"
          echo "OFFHOST_SIGNED_WITNESS=NOT_VERIFIED"
          echo "OWNER_SIGNATURE=NOT_VERIFIED"
          echo "BROWSER_MCP_INLINE_FULL_E2E=NOT_VERIFIED"
          echo "ESTOP_INFLIGHT_TERMINATION=NOT_IMPLEMENTED_BY_SOURCE"
          {
            echo '### Hermes HX P1 real fake-HTTP-provider turn test'
            echo "Exact research SHA: $HX_SOURCE_SHA"
            echo 'Success validates a real local-HTTP fake-provider turn and a refused protected file write. This is NOT paid-provider E2E or full Browser/MCP/Inline E2E.'
            echo 'The upstream ESTOP pauses **new** work, not in-flight work.'
            echo '**NO-GO:** no external signed witness, owner approval signatures, end-to-end model call, complete OS broker, or production authorization.'
            echo 'PRODUCTION=HOLD; HITL=REQUIRED; default paid spend $0 (billing not attested).'
          } >> "$GITHUB_STEP_SUMMARY"
