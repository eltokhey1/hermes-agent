name: Hermes Owner P0 Offline Preflight (synthetic only)

on:
  pull_request:
    paths:
      - 'ops/preflight/**'
      - '.github/workflows/hermes-owner-p0-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-preflight:
    name: Python 3.14 / ${{ matrix.os }} (non-acceptance)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Compile preflight tooling
        run: python -m compileall -q ops/preflight
      - name: Run synthetic preflight contracts
        run: python -m unittest discover -s ops/preflight -p 'test_*.py' -v
      - name: Explicit acceptance boundary
        run: |
          echo "SYNTHETIC_OWNER_P0=PASS_ONLY_IF_TESTS_PASS"
          echo "OWNER_WINDOWS_P0=UNVERIFIED"
          echo "HERMES_FUNCTIONAL_RESTORE=NOT_TESTED"
          echo "PRODUCTION=HOLD"
