name: "PR10 independent adversarial acceptance (non-production)"

on:
  push:
    branches:
      - research/pr10-sha-7eff2a5-20261111
    paths:
      - ".github/workflows/pr10-independent-acceptance.yml"
      - "verification/test_pr10_independent_acceptance.py"

permissions:
  contents: read

jobs:
  independent-negative-cases:
    name: "Independent negative cases - pinned PR10 original SHA"
    if: github.repository == 'eltokhey1/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: "7eff2a5723303f20aff3dbb91380fb5a09328368"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PR10_SOURCE_SCRIPT: "${{ github.workspace }}/source/optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py"
    steps:
      - name: Checkout ORIGINAL PR10 code at exact SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py
          sparse-checkout-cone-mode: false
      - name: Checkout independent tests separately (NEVER into PR10)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: audit
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            verification/test_pr10_independent_acceptance.py
          sparse-checkout-cone-mode: false
      - name: Verify source is original and adversarial tests are separate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C source hash-object optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py)" = "ed645398a09b8a86c871461db25e9c1965e70096"
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
          echo "VERIFIED_ORIGINAL_PR10_SHA=$TARGET_SHA"
          echo "INDEPENDENT_AUDIT_SHA=$GITHUB_SHA"
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pytest in temporary runner only
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input --no-cache-dir "pytest==9.0.2"
      - name: Execute 8 NEW adversarial acceptance cases
        shell: bash
        run: python -m pytest -v -ra audit/verification/test_pr10_independent_acceptance.py
      - name: Explicit NO-GO boundary
        if: always()
        shell: bash
        run: |
          echo "PRODUCTION=HOLD"
          echo "HITL=REQUIRED"
          echo "G0_GCODE_G1=NO-GO"
          echo "INDEPENDENT_REVIEW_NOT_PRODUCTION_APPROVAL=true"
          echo "REAL_CARRIER_AUTHENTICATION=NOT_TESTED"
          echo "OWNER_WINDOWS_P0_P1=NOT_TESTED"
