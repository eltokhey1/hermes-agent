name: Hermes P0-P1 Offline Staging (non-acceptance)

# Isolated synthetic tests only. No production release, deployment, or Windows access.
on:
  push:
    branches:
      - owner-staging/p0p1-cloud-local-20261020
    paths:
      - 'owner_staging/p0p1/**'
      - '.github/workflows/hermes-p0p1-offline-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-p0p1-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-unit-tests:
    if: github.repository == 'eltokhey1/hermes-agent' && github.ref == 'refs/heads/owner-staging/p0p1-cloud-local-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      HERMES_DISABLE_LAZY_INSTALLS: '1'
    steps:
      - name: Checkout only isolated staging files, without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable SHA
        with:
          persist-credentials: false
          sparse-checkout: |
            owner_staging/p0p1
            agent/estop.py
            tools/environments/docker.py
            tools/terminal_tool_backends.py
          sparse-checkout-cone-mode: false
      - name: Require sufficient test discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('owner_staging/p0p1/tests', pattern='test_*.py')
          count = suite.countTestCases()
          print('Discovered synthetic tests:', count)
          if count < 153:
              raise SystemExit('FAIL: test-discovery regression (minimum 153)')
          PY
      - name: Run offline standard-library tests only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s owner_staging/p0p1/tests -p 'test_*.py' -v

      - name: Static risk scan of pinned Hermes source (non-acceptance)
        shell: bash
        run: |
          set -euo pipefail
          python3 owner_staging/p0p1/source_contract_audit.py --source-root . > "$RUNNER_TEMP/hermes-source-audit.json"
          python3 - "$RUNNER_TEMP/hermes-source-audit.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              result = json.load(handle)
          names = ('estop', 'docker', 'terminal_backends')
          states = {name: result['sources'][name]['status'] for name in names}
          print('Hermes static source parse statuses:', states)
          assert all(v == 'PARSED' for v in states.values()), 'Source unavailable or unparseable'
          assert result['review_signals']['estop_new_work_only_documented'] is True, 'ESTOP behavior review changed'
          assert result['review_signals']['docker_default_network'] is True, 'Docker network default review changed'
          assert 'ESTOP_STATED_NEW_WORK_ONLY_NOT_KILL_SWITCH' in result['risk_flags']
          assert 'DOCKER_NETWORK_DEFAULT_NOT_PROVEN_OFF' in result['risk_flags']
          assert result['assessment'] == 'HOLD' and result['production'] == 'HOLD'
          print('STATIC_SOURCE_AUDIT_PASS_NON_ACCEPTANCE; PRODUCTION_HOLD')
          PY

  synthetic-windows-tests:
    if: github.repository == 'eltokhey1/hermes-agent' && github.ref == 'refs/heads/owner-staging/p0p1-cloud-local-20261020'
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HERMES_DISABLE_LAZY_INSTALLS: '1'
    steps:
      - name: Checkout staging and reviewed source without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            owner_staging/p0p1
            agent/estop.py
            tools/environments/docker.py
            tools/terminal_tool_backends.py
          sparse-checkout-cone-mode: false
      - name: Pin Python 3.13 on Windows CI only
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Execute 153 offline tests on hosted Windows
        shell: pwsh
        run: |
          python --version
          python -m unittest discover -s owner_staging/p0p1/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse real Hermes sources on hosted Windows (non-acceptance)
        shell: pwsh
        run: |
          python owner_staging/p0p1/source_contract_audit.py --source-root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# G0/G-CODE/G1 remain NO-GO and PRODUCTION remains HOLD even when this workflow succeeds.
