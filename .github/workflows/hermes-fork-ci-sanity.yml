name: Hermes Fork CI Sanity (supplemental, non-acceptance)

# This workflow supplements but NEVER bypasses, cancels, replaces or marks
# successful the repository's strict CI, Docker, Nix or owner host P0/P1 gates.
on:
  pull_request:
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/hermes-fork-ci-sanity.yml'
      - 'tests/ci/test_owner_fork_ci_sanity.py'
      - 'scripts/ci/classify_changes.py'
      - 'scripts/ci/required_results.py'
      - 'scripts/ci/audit_runner_portability.py'
      - 'tests/ci/test_owner_fork_runner_portability.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-sanity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stdlib-contract:
    name: Python 3.14 / ${{ matrix.os }} (supplementary only)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Compile classifier and strict gate
        run: python -m py_compile scripts/ci/classify_changes.py scripts/ci/required_results.py
      - name: Verify classification and fail-closed gating
        run: python -m unittest discover -s tests/ci -p test_owner_fork_ci_sanity.py -v
      - name: Inventory nonstandard runner dependencies (read-only)
        run: python scripts/ci/audit_runner_portability.py
      - name: Check inventory correctly refuses to certify CI
        run: python -m unittest discover -s tests/ci -p test_owner_fork_runner_portability.py -v
      - name: Explicitly preserve main acceptance boundaries
        run: |
          echo "SUPPLEMENTAL_CHECK_ONLY=TRUE"
          echo "GENERAL_CI=NONSUBSTITUTABLE"
          echo "OWNER_WINDOWS_P0=UNVERIFIED"
          echo "PRODUCTION=HOLD"
