name: "PR10 pinned synthetic smoke (non-acceptance)"

on:
  push:
    branches:
      - research/pr10-sha-7eff2a5-20261111
    paths:
      - ".github/workflows/pr10-pinned-synthetic-smoke.yml"

permissions:
  contents: read

jobs:
  pr10-exact-sha:
    name: "Offline synthetic pytest at PR10 exact SHA"
    if: github.repository == 'eltokhey1/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: "7eff2a5723303f20aff3dbb91380fb5a09328368"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out pinned commit with no stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tests/skills/test_shipment_intelligence_skill.py
            optional-skills/research/shipment-intelligence/
          sparse-checkout-cone-mode: false
      - name: Verify SHA and four upstream blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object optional-skills/research/shipment-intelligence/SKILL.md)" = "e8b8b7c7d8233404810a368897a25c6978408b5d"
          test "$(git hash-object optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py)" = "ed645398a09b8a86c871461db25e9c1965e70096"
          test "$(git hash-object optional-skills/research/shipment-intelligence/templates/synthetic_dcsa_events.json)" = "80a1b5252a699402246ffcdec8f74b3fbcbffd6c"
          test "$(git hash-object tests/skills/test_shipment_intelligence_skill.py)" = "8866387ed61c9bb8105225a2187d97b149b50661"
          printf 'VERIFIED_TARGET_SHA=%s\n' "$TARGET_SHA"
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install test-only dependency in ephemeral runner
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input --no-cache-dir "pytest==9.0.2"
      - name: Run focused synthetic offline tests
        shell: bash
        run: |
          python -m pytest -q tests/skills/test_shipment_intelligence_skill.py
      - name: Explicit non-acceptance boundary
        if: always()
        shell: bash
        run: |
          echo 'HERMES_PRODUCTION=HOLD'
          echo 'HITL=REQUIRED'
          echo 'PR10_CI_IS_SYNTHETIC_ONLY=true'
          echo 'REAL_PROVIDER_INTEGRATION=NOT_TESTED'
          echo 'OWNER_WINDOWS_P0_P1=NOT_TESTED'
