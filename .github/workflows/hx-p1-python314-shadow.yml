name: Hermes HX P1 Python 3.14 source-backed Shadow (NO-GO)
on:
  push:
    branches:
      - research/p1-python314-shadow-20261123
    paths:
      - .github/workflows/hx-p1-python314-shadow.yml

permissions:
  contents: read

concurrency:
  group: hx-p1-314-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-agent-shadow:
    name: Isolated real AIAgent import and constructor, NO-GO
    if: github.repository == 'eltokhey1/hermes-agent' && github.ref == 'refs/heads/research/p1-python314-shadow-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION: HOLD
      HITL: REQUIRED
      HX_SOURCE_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout research SHA without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight exact commit and research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'eltokhey1/hermes-agent'
          test "$GITHUB_REF" = 'refs/heads/research/p1-python314-shadow-20261123'
          test "$(git rev-parse HEAD)" = "$HX_SOURCE_SHA"
          echo "CHECKED_OUT_SHA=$HX_SOURCE_SHA"
      - name: Prepare exact Python and uv from Hermes project lock (no extras or cache)
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
          test-environment: 'false'
          cache: 'false'
          cache-python: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
      - name: Verify Python 3.14 and project dependency import
        shell: bash
        env:
          HERMES_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          set -euo pipefail
          test -x "$HERMES_PYTHON"
          "$HERMES_PYTHON" -B -c 'import sys,ruamel.yaml;assert sys.version_info[:2] == (3,14);print("PY314_DEPENDENCIES=VERIFIED",sys.version.split()[0])'
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("pm/lock.json").read_text())["packages"]
          assert j["uv"]["version"]=="0.12.3"
          assert j["python"]["version"]=="3.14.7+20260901"
          assert Path("uv.lock").is_file()
          print("EXACT_TOOLCHAIN_PIN=VERIFIED")
          PY
      - name: Boot real AIAgent in pre-established mount and network namespaces
        shell: bash
        env:
          HERMES_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HX_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/hx-home" "$RUNNER_TEMP/hx-runtime"
          before="$(sha256sum AGENTS.md | cut -d' ' -f1)"
          cat > "$RUNNER_TEMP/hx-p1-boot.py" <<'PY'
          import json,os,socket,subprocess,sys
          from pathlib import Path
          from unittest.mock import patch
          def stage(name,result,detail=""):
              print("HX_P1_EVIDENCE="+json.dumps({"stage":name,"status":result,"detail":str(detail)[:190],"PRODUCTION":"HOLD","HITL":"REQUIRED","release":"NO-GO","sha":os.getenv("HX_SOURCE_SHA","UNKNOWN")}),flush=True)
          if sys.version_info[:2]!=(3,14):
              stage("python","BLOCKED",sys.version);sys.exit(2)
          st=Path("/proc/self/status").read_text()
          if not all(x in st for x in ("NoNewPrivs:\t1","CapEff:\t0000000000000000","CapBnd:\t0000000000000000")):
              stage("os_identity","BLOCKED","capabilities or no_new_privs mismatch");sys.exit(2)
          protected=Path(os.environ["GITHUB_WORKSPACE"])/"AGENTS.md"
          expected=protected.read_bytes()
          try:
              protected.write_bytes(b"DO_NOT_WRITE")
          except OSError:
              pass
          else:
              stage("readonly_kernel","FAIL","unexpected write");sys.exit(2)
          if protected.read_bytes()!=expected:
              stage("readonly_kernel","FAIL","fixture modified");sys.exit(2)
          try:
              socket.create_connection(("1.1.1.1",443),timeout=1)
          except OSError:
              pass
          else:
              stage("no_network","FAIL","unexpected route");sys.exit(2)
          child=subprocess.run(["/bin/sh","-c","printf BAD >> AGENTS.md"],cwd=os.environ["GITHUB_WORKSPACE"],capture_output=True,timeout=5)
          if child.returncode==0 or protected.read_bytes()!=expected:
              stage("child_write","FAIL","unexpected subprocess write");sys.exit(2)
          stage("os_preflight","VERIFIED_PARTIAL","mount readonly; no network; child blocked; zero caps")
          try:
              from run_agent import AIAgent
          except Exception as exc:
              stage("import_real_facade","BLOCKED",repr(exc));sys.exit(2)
          stage("import_real_facade","VERIFIED","original source")
          try:
              with (patch("model_tools.get_tool_definitions",return_value=[]),
                    patch("model_tools.check_toolset_requirements",return_value={}),
                    patch("hermes_cli.config.load_config",return_value={}),
                    patch("hermes_cli.config.load_config_readonly",return_value={}),
                    patch("agent.process_bootstrap.OpenAI")):
                  agent=AIAgent(api_key="HX_SYNTHETIC_DUMMY",base_url="http://127.0.0.1:9/v1",max_iterations=1,quiet_mode=True,skip_context_files=True,skip_memory=True,save_trajectories=False,platform="cli")
              assert isinstance(agent,AIAgent)
          except Exception as exc:
              stage("construct_real_AIAgent","BLOCKED",repr(exc));sys.exit(2)
          stage("construct_real_AIAgent","VERIFIED_PARTIAL","provider stubbed; conversation NOT run")
          from tools.file_tools import write_file_tool
          try: 
              result=write_file_tool(str(protected),"DO_NOT_WRITE",task_id="hx-p1-shadow")
          except Exception as exc:
              result=repr(exc)
          if protected.read_bytes()!=expected:
              stage("real_file_tool","FAIL","real file tool changed fixture");sys.exit(2)
          stage("real_file_tool","DENIED",str(result)[:120])
          from tools.terminal_tool import terminal_tool
          try:
              result=terminal_tool(command="printf BAD >> AGENTS.md",workdir=os.environ["GITHUB_WORKSPACE"],timeout=5)
          except Exception as exc:
              result=repr(exc)
          if protected.read_bytes()!=expected:
              stage("real_terminal_tool","FAIL","real terminal changed fixture");sys.exit(2)
          stage("real_terminal_tool","DENIED",str(result)[:120])
          # Original Browser API: block cloud instance metadata without starting Chromium.
          from tools.browser_tool import browser_navigate
          with patch("tools.browser_tool_session._run_browser_command",
                     side_effect=AssertionError("BROWSER_BACKEND_MUST_NOT_START")):
              browser_result=json.loads(browser_navigate(
                  "http://169.254.169.254/latest/meta-data/",task_id="hx-p1-shadow"))
          if browser_result.get("success") is not False or "cloud metadata" not in str(browser_result.get("error","")).lower():
              stage("real_browser_metadata","FAIL",browser_result);sys.exit(2)
          stage("real_browser_metadata","DENIED_BEFORE_BACKEND","real browser_navigate; IMDS URL blocked")
          if protected.read_bytes()!=expected:
              stage("real_browser_metadata","FAIL","protected file changed");sys.exit(2)
          # Original MCP handler with an untrusted write tool and an unavailable approval surface.
          # NO MCP server is started. The transport is guarded by an assertion.
          import tools.mcp_tool as mc
          from tools.mcp_tool_scope import _server_key,_resolve_server_key
          from tools.mcp_tool_handlers import _make_tool_handler
          server_name="hx_p1_untrusted_offline"
          own_key=_server_key(server_name)
          if _resolve_server_key(server_name,scope="hx_a",current=False)==_resolve_server_key(server_name,scope="hx_b",current=False):
              stage("mcp_scope_isolation","FAIL","scopes collapsed");sys.exit(2)
          stage("mcp_scope_isolation","VERIFIED_UNIT_SCOPE","actual MCP scope router; no server")
          prior_trust=mc._server_trust_levels.get(own_key)
          prior_hints=mc._tool_read_only_hints.get(own_key)
          mc._server_trust_levels[own_key]=mc._TRUST_UNTRUSTED
          mc._tool_read_only_hints[own_key]={"untrusted_write":False}
          try:
              with patch("tools.approval_prompt.request_elicitation_consent",
                         side_effect=RuntimeError("HX_APPROVAL_SURFACE_UNAVAILABLE")), patch(
                          "tools.mcp_tool_handlers._acquire_call_server",
                          side_effect=AssertionError("MCP_TRANSPORT_MUST_NOT_BE_CALLED")):
                  mcp_result=_make_tool_handler(server_name,"untrusted_write",3.0)({"path":str(protected)})
              parsed=json.loads(mcp_result)
              if "blocked" not in str(parsed.get("error","")).lower():
                  stage("mcp_untrusted_write","FAIL",parsed);sys.exit(2)
          finally:
              if prior_trust is None:mc._server_trust_levels.pop(own_key,None)
              else:mc._server_trust_levels[own_key]=prior_trust
              if prior_hints is None:mc._tool_read_only_hints.pop(own_key,None)
              else:mc._tool_read_only_hints[own_key]=prior_hints
          if protected.read_bytes()!=expected:
              stage("mcp_untrusted_write","FAIL","protected file changed");sys.exit(2)
          stage("mcp_untrusted_write","DENIED_BEFORE_TRANSPORT","real MCP handler; unavailable approval simulated; zero MCP RPCs")
          # Original inline executor bypasses registry: exercise memory-only TodoStore,
          # plus malformed arguments. This does not claim file/network enforcement for Inline.
          from agent.inline_tool_executors import resolve_invoke_tool_executor,InlineToolContext
          executor=resolve_invoke_tool_executor(agent,"todo_list")
          if not callable(executor):
              stage("real_inline_todo","FAIL","missing executor");sys.exit(2)
          inline_ctx=InlineToolContext(effective_task_id="hx-p1-shadow")
          payload={"todos":[{"id":"hx1","content":"local synthetic task","status":"pending"}]}
          inline_result=json.loads(executor(agent,payload,inline_ctx))
          if len(inline_result.get("todos",[]))!=1 or inline_result["todos"][0]["id"]!="hx1":
              stage("real_inline_todo","FAIL",inline_result);sys.exit(2)
          before_bad_revision=agent._todo_store.snapshot()["revision"]
          # Bare strings are deliberately coerced to arrays. Use an input
          # the TodoStore contract MUST reject instead of asserting a false failure.
          bad=json.loads(executor(agent,{"todos":[{"id":"hx2","content":"","status":"pending"}]},inline_ctx))
          if "empty or missing content" not in str(bad.get("error","")).lower():
              stage("real_inline_invalid","FAIL","empty-content item not rejected");sys.exit(2)
          after_bad=json.loads(executor(agent,{},inline_ctx))
          if after_bad.get("todos")!=inline_result.get("todos"):
              stage("real_inline_invalid","FAIL","state changed after error");sys.exit(2)
          if agent._todo_store.snapshot()["revision"]!=before_bad_revision:
              stage("real_inline_invalid","FAIL","revision changed after error");sys.exit(2)
          if protected.read_bytes()!=expected:
              stage("real_inline_todo","FAIL","protected file changed");sys.exit(2)
          stage("real_inline_todo","VERIFIED_IN_MEMORY","real inline executor, no registry")
          stage("real_inline_invalid","DENIED","malformed todo rejected, state unchanged")
          stage("research_exit","PARTIAL_PASS","Browser IMDS; MCP trust deny; Inline todo verified. Real MCP network/Browser navigation/Inline external effects/ESTOP/signers NOT TESTED; NO-GO")
          PY
          # User-namespace mapping is disabled on this GH runner; never fall back to bare Python.
          # Root creates mount/net/pid namespaces, drops to nobody and all capabilities BEFORE Python.
          HX_BOOT_SCRIPT=/tmp/hx-p1-boot-$GITHUB_RUN_ID.py
          cp "$RUNNER_TEMP/hx-p1-boot.py" "$HX_BOOT_SCRIPT"
          chmod 644 "$HX_BOOT_SCRIPT"
          # The runner owns the pinned Python venv; dropping to its own UID allows read-only imports.
          HX_UNPRIV_UID="$(id -u)"
          HX_UNPRIV_GID="$(id -g)"
          # Root-owned collector is outside the worker's namespace; worker has no write permission.
          HX_EVIDENCE_SPOOL="$RUNNER_TEMP/hx-p1-evidence.$GITHUB_RUN_ID.log"
          sudo -n install -m 0600 -o root -g root /dev/null "$HX_EVIDENCE_SPOOL"
          timeout 85 sudo -n /usr/bin/env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" HERMES_PYTHON="$HERMES_PYTHON" HX_SOURCE_SHA="$HX_SOURCE_SHA" RUNNER_TEMP="$RUNNER_TEMP" HX_BOOT_SCRIPT="$HX_BOOT_SCRIPT" HX_UNPRIV_UID="$HX_UNPRIV_UID" HX_UNPRIV_GID="$HX_UNPRIV_GID" unshare --mount --net --pid --fork /bin/bash -euo pipefail -c '
            mount --make-rprivate /
            mount --bind "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
            mount -o remount,bind,ro "$GITHUB_WORKSPACE"
            exec setpriv --reuid="$HX_UNPRIV_UID" --regid="$HX_UNPRIV_GID" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
              env -i HOME="$RUNNER_TEMP/hx-home" HERMES_HOME="$RUNNER_TEMP/hx-home" \
              HERMES_RUNTIME_DIR="$RUNNER_TEMP/hx-runtime" PYTHONPATH="$GITHUB_WORKSPACE" \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" HX_SOURCE_SHA="$HX_SOURCE_SHA" \
              PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 PATH=/usr/local/bin:/usr/bin:/bin \
              "$HERMES_PYTHON" -B "$HX_BOOT_SCRIPT"
          ' | sudo -n tee "$HX_EVIDENCE_SPOOL"
          after="$(sha256sum AGENTS.md | cut -d' ' -f1)"
          test "$before" = "$after"
          echo "EXTERNAL_READONLY_WITNESS=VERIFIED sha256:$after"
      - name: Verify worker evidence outside its namespace with root-owned collector
        shell: bash
        run: |
          set -euo pipefail
          SPOOL="$RUNNER_TEMP/hx-p1-evidence.$GITHUB_RUN_ID.log"
          test -f "$SPOOL"
          sudo -n /usr/bin/python3 - "$SPOOL" "$GITHUB_WORKSPACE" "$HX_SOURCE_SHA" "$(id -u)" "$(id -g)" <<'PY'
          import json,subprocess,hashlib,sys,os,stat
          spool,root,sha,uid,gid=sys.argv[1:]
          uid,gid=int(uid),int(gid)
          st=os.stat(spool)
          assert st.st_uid==0 and stat.S_IMODE(st.st_mode)==0o600, "spool not root-owned"
          lines=open(spool,encoding="utf-8").read().splitlines()
          rec=[]
          for line in lines:
              if line.startswith("HX_P1_EVIDENCE="):
                  rec.append(json.loads(line.split("=",1)[1]))
          outcomes={r["stage"]:r["status"] for r in rec}
          required={
            "os_preflight":"VERIFIED_PARTIAL",
            "import_real_facade":"VERIFIED",
            "construct_real_AIAgent":"VERIFIED_PARTIAL",
            "real_file_tool":"DENIED",
            "real_terminal_tool":"DENIED",
            "real_browser_metadata":"DENIED_BEFORE_BACKEND",
            "mcp_scope_isolation":"VERIFIED_UNIT_SCOPE",
            "mcp_untrusted_write":"DENIED_BEFORE_TRANSPORT",
            "real_inline_todo":"VERIFIED_IN_MEMORY",
            "real_inline_invalid":"DENIED",
            "research_exit":"PARTIAL_PASS"}
          for key,value in required.items():
              assert outcomes.get(key)==value,(key,outcomes.get(key))
          assert len(rec)==len(required),"unexpected duplicate or missing evidence"
          for row in rec:
              assert row["sha"]==sha and row["PRODUCTION"]=="HOLD" and row["HITL"]=="REQUIRED"
              assert row["release"]=="NO-GO"
          expected=subprocess.check_output(["git","-C",root,"show",sha+":AGENTS.md"])
          actual=open(os.path.join(root,"AGENTS.md"),"rb").read()
          assert hashlib.sha256(expected).digest()==hashlib.sha256(actual).digest()
          # A second, independently launched namespace attempts the forbidden write.
          # Its failure is observed by this root-owned verifier, not self-reported by AIAgent.
          independent_probe = """set -euo pipefail
          mount --make-rprivate /
          mount --bind "$HX_W_ROOT" "$HX_W_ROOT"
          mount -o remount,bind,ro "$HX_W_ROOT"
          exec setpriv --reuid="$HX_W_UID" --regid="$HX_W_GID" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all /bin/bash -c 'printf VIOLATION_WITNESS >> "$HX_W_ROOT/AGENTS.md"'
          """
          verifier=subprocess.run(
              ["unshare","--mount","--net","--pid","--fork","/bin/bash","-euo","pipefail","-c",independent_probe],
              env={"PATH":"/usr/local/bin:/usr/bin:/bin","HX_W_ROOT":root,"HX_W_UID":str(uid),"HX_W_GID":str(gid)},
              text=True,capture_output=True,timeout=25)
          assert verifier.returncode!=0, "independent write unexpectedly succeeded"
          assert "Read-only file system" in verifier.stderr, "independent denial was not from readonly mount"
          assert open(os.path.join(root,"AGENTS.md"),"rb").read()==expected, "independent probe changed source"
          print("OUTSIDE_WORKER_KERNEL_WRITE_DENIAL=VERIFIED code="+str(verifier.returncode))
          print("OUTSIDE_WORKER_SOURCE_UNCHANGED=VERIFIED")
          print("OUT_OF_WORKER_WITNESS=PARTIAL_PASS")
          print("SPARED_PROTECTED_SOURCE_SHA256="+hashlib.sha256(actual).hexdigest())
          print("SOURCE_SHA="+sha)
          print("EVIDENCE_STAGES="+str(len(outcomes)))
          print("WITNESS_LIMIT=same_runner_non_worker; no external signer; P1_REAL=NO-GO")
          PY
      - name: Report non-production decision regardless of earlier failures
        if: always()
        shell: bash
        run: |
          echo 'PRODUCTION=HOLD'
          echo 'HITL=REQUIRED'
          echo 'G0/G-CODE/G1=NO-GO'
          echo 'P1_REAL=NO-GO'
          {
            echo '### Hermes HX — P1 real-worker source-backed research'
            echo "Checked source SHA: $HX_SOURCE_SHA"
            echo 'A green job is NOT production authorization.'
            echo 'Real model E2E/Browser navigation/MCP transport/Inline external effects/independent human approval/ESTOP: NOT VERIFIED.'
            echo 'PRODUCTION=HOLD; HITL=REQUIRED; P1_REAL=NO-GO.'
          } >> "$GITHUB_STEP_SUMMARY"
