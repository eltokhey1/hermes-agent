name: "PR10 patch regate v2 - explicit fail closed"
on:
  push:
    branches:
      - research/pr10-sha-7eff2a5-20261111
    paths:
      - ".github/workflows/pr10-patch-regate-v2-20261112.yml"

permissions:
  contents: read

jobs:
  regression-and-integrity:
    if: github.repository == 'eltokhey1/hermes-agent'
    name: "Original + adversarial v2 / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PATCH_SHA: "a06c67115ebfe86895d43038dc1fcdf4589fd0ff"
      AUDIT_SHA: "ed56c5d64c312a2bea7aceb5911211d768c08fda"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PR10_SOURCE_SCRIPT: "${{ github.workspace }}/src/optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py"
    steps:
      - name: Checkout exact patched SHA, no credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PATCH_SHA }}
          path: src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py
            tests/skills/test_shipment_intelligence_skill.py
          sparse-checkout-cone-mode: false
      - name: Checkout independently stored test v2 at immutable SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.AUDIT_SHA }}
          path: audit
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            verification/test_pr10_independent_acceptance_v2.py
          sparse-checkout-cone-mode: false
      - name: Verify source and tests SHA and code blob hash
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "$PATCH_SHA"
          test "$(git -C audit rev-parse HEAD)" = "$AUDIT_SHA"
          test "$(git -C src hash-object optional-skills/research/shipment-intelligence/scripts/shipment_intelligence.py)" = "e91321927da1d3ac8f5281a896f8cba7b310b1f7"
          test "$(git -C src hash-object tests/skills/test_shipment_intelligence_skill.py)" = "8866387ed61c9bb8105225a2187d97b149b50661"
          echo "VERIFIED_PATCH_SHA=$PATCH_SHA"
          echo "VERIFIED_AUDIT_V2_SHA=$AUDIT_SHA"
          echo "PATCH_SOURCE_BLOB=e91321927da1d3ac8f5281a896f8cba7b310b1f7"
      - name: Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Ephemeral pytest test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input --no-cache-dir "pytest==9.0.2"
      - name: Original 32 cases - unchanged from PR10
        shell: bash
        run: python -m pytest -q src/tests/skills/test_shipment_intelligence_skill.py
      - name: Independent v2 negative cases - tampering must raise
        shell: bash
        run: python -m pytest -q -ra audit/verification/test_pr10_independent_acceptance_v2.py
      - name: Non acceptance boundary
        if: always()
        shell: bash
        run: |
          echo "PRODUCTION=HOLD"
          echo "HITL=REQUIRED"
          echo "G0_GCODE_G1=NO-GO"
          echo "REAL_CARRIER_EVENTS=NOT_TESTED"
          echo "OWNER_WINDOWS_P0_P1=NOT_TESTED"
          echo "HASH_IS_NOT_PROVIDER_AUTHENTICATION=true"
